<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FF7B7B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="嘻嘻成长记录" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>嘻嘻成长记录</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // 兜底：主 JS 加载失败时（旧 SW 缓存了旧 HTML，引用的 JS hash 已不存在），
      // 自动注销 Service Worker + 清除 Cache Storage 并刷新，避免白屏卡死
      window.addEventListener('error', function (e) {
        var el = e.target;
        if (el && el.tagName === 'SCRIPT' && el.src && el.src.indexOf('/assets/') !== -1) {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister(); }));
            }).then(function () {
              if ('caches' in window) {
                return caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                });
              }
            }).then(function () {
              window.location.reload();
            });
          } else {
            window.location.reload();
          }
        }
      }, true);
    </script>
  </body>
</html>
